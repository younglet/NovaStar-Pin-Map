<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaStar (ESP32) Pinmap</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.8;
        }

        .canvas-container {
            background: white;
            border-radius: 20px;
            padding: 0px;
            max-width: 1400px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            min-height: 850px;
        }

        #animCanvas, #pinmapCanvas {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
        }

        #animCanvas {
            z-index: 10;
        }

        #pinmapCanvas {
            z-index: 5;
        }

        .filter-panel {
            background: #f9f9f9;
            border-radius: 12px;
            padding: 20px;
            max-width: 1400px;
            width: calc(100% - 60px);
            border: 1px solid #e0e0e0;
            position: absolute;
            bottom: 30px;
            left: 30px;
            right: 30px;
            opacity: 0;
            transition: opacity 0.6s ease-out;
            z-index: 20;
        }

        .filter-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .filter-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            cursor: pointer;
            padding: 8px;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .filter-item:hover {
            background: #e8f0ff;
        }

        .filter-item input[type="checkbox"] {
            cursor: pointer;
            width: 18px;
            height: 18px;
        }

        .filter-item label {
            cursor: pointer;
            flex: 1;
            color: #333;
            margin-bottom: 0;
        }

        .filter-item .count {
            color: #999;
            font-size: 0.85em;
        }

        canvas {
            display: block;
            max-width: 100%;
            height: auto;
            background: white;
            user-select: none;
            -webkit-user-select: none;
        }

        .pin-info {
            position: absolute;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.9em;
            pointer-events: none;
            z-index: 100;
            width: 250px;
            word-wrap: break-word;
        }

        .pin-info .pin-header {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 6px;
            font-size: 1.1em;
        }

        .pin-info .pin-features {
            color: #aed581;
            font-size: 0.85em;
            line-height: 1.4;
        }


        .info-panel {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 20px;
            margin-top: 30px;
            max-width: 1400px;
            width: 100%;
        }

        .info-panel h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .info-item {
            background: #f9f9f9;
            padding: 15px;
            border-left: 4px solid #667eea;
            border-radius: 6px;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.5s ease-out, transform 0.5s ease-out;
        }

        .info-item.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .info-item:nth-child(2) { transition-delay: 0.1s; }
        .info-item:nth-child(3) { transition-delay: 0.2s; }
        .info-item:nth-child(4) { transition-delay: 0.3s; }
        .info-item:nth-child(5) { transition-delay: 0.4s; }
        .info-item:nth-child(6) { transition-delay: 0.5s; }
        .info-item:nth-child(7) { transition-delay: 0.6s; }
        .info-item:nth-child(8) { transition-delay: 0.7s; }

        .info-item strong {
            color: #667eea;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1> NovaStar ESP32 引脚功能图</h1>
        <p>交互式引脚功能对应图</p>
    </div>

    <div class="canvas-container">
        <canvas id="animCanvas"></canvas>
        <canvas id="pinmapCanvas" style="display: none;"></canvas>
        <div id="pinInfo" class="pin-info" style="display: none;"></div>
        <div class="filter-panel" id="filterPanel"></div>
    </div>

    <div class="info-panel">
        <h3>📋 引脚功能说明</h3>
        <div class="info-grid" id="infoGrid"></div>
    </div>

    <script>
        // ===== 配置参数 =====
        const PIN_RADIUS = 8;
        // 引脚相对图片的位置参数
        const LEFT_PIN_OFFSET = 20;        // 左侧引脚距离图片的水平距离
        const RIGHT_PIN_OFFSET = 20;       // 右侧引脚距离图片的水平距离
        const TOP_PIN_OFFSET = 15;         // 顶部引脚距离图片的垂直距离
        const FILTER_PANEL_OFFSET = 50;    // 筛选面板距离图片下边缘的距离

        // 行高（像素）
        const PIN_ROW_HEIGHT = 26;

        // 各边的起始Y坐标（像素）
        const LEFT_START_Y = 80;
        const RIGHT_START_Y = 100;

        // SPI和I2C的起始Y坐标（像素，相对于图片顶部）
        const I2C_START_Y = 265;
        const SPI_START_Y = 135;

        // SPI和I2C引脚距离图片的水平距离
        const I2C_PIN_OFFSET = 120;
        const SPI_PIN_OFFSET = -100;

        // 格式化GPIO文字：GPIO 和数字之间留空隙，单数字右对齐
        function formatGpioText(pinName) {
            // 提取数字部分
            const match = pinName.match(/GPIO(\d+)/);
            if (match) {
                const num = match[1];
                const paddedNum = num.padStart(2, ' '); // 单数字前面加空格实现右对齐
                return 'GPIO ' + paddedNum;
            }
            return pinName;
        }

        // ===== 全局变量 =====
        let pinConfig = null;
        let canvas = null;
        let ctx = null;
        let boardImage = null;
        let selectedFeatures = new Set();
        let featureStats = {};
        let allInteractivePins = [];  // 用于交互的引脚数组
        let i2cPinPositions = {};     // I2C引脚位置
        let spiPinPositions = {};     // SPI引脚位置

        // 从JSON加载配置
        async function loadConfig() {
            try {
                const response = await fetch('pins.json');
                pinConfig = await response.json();
                loadBoardImage();
            } catch (error) {
                console.error('Failed to load pins.json:', error);
                alert('无法加载配置文件');
            }
        }

        // 加载NovaStar图片
        function loadBoardImage() {
            boardImage = new Image();
            boardImage.onload = () => {
                init();
            };
            boardImage.onerror = () => {
                console.error('Failed to load board image');
                init();
            };
            boardImage.src = 'novastar.jpg';
        }

        function init() {
            // 获取两个canvas
            const animCanvasEl = document.getElementById('animCanvas');
            canvas = document.getElementById('pinmapCanvas');

            // 设置canvas大小
            const container = canvas.parentElement;
            const canvasW = Math.min(1600, container.clientWidth - 80);
            const canvasH = 850;

            animCanvasEl.width = canvasW;
            animCanvasEl.height = canvasH;
            canvas.width = canvasW;
            canvas.height = canvasH;

            const animCtx = animCanvasEl.getContext('2d');
            ctx = canvas.getContext('2d');

            // 统计功能和计数
            collectFeatureStats();
            buildFilterPanel();

            // 播放入场动画
            playEntranceAnimation(animCanvasEl, animCtx, canvasW, canvasH, () => {
                // 动画完成后的回调
                // 显示交互canvas，隐藏动画canvas
                animCanvasEl.style.display = 'none';
                canvas.style.display = 'block';

                // 绘制静态引脚图
                drawPinmap();
                setupInteractivity();

                // 筛选面板淡入
                const filterPanel = document.getElementById('filterPanel');
                filterPanel.style.transition = 'opacity 0.3s ease-out';
                filterPanel.style.opacity = '1';
            });

            buildInfoPanel();
        }

        // 入场动画：板子旋转 + 引脚从中间推出
        function playEntranceAnimation(animCanvas, animCtx, canvasW, canvasH, onComplete) {
            const centerX = canvasW / 2;
            const startTime = performance.now();
            const boardAnimDuration = 600; // 板子旋转时间
            const pinAnimDelay = 400;      // 引脚动画延迟
            const pinAnimDuration = 300;   // 引脚推出时间

            const imgWidth = 573;
            const imgHeight = (imgWidth * boardImage.height) / boardImage.width;
            const imgX = centerX - imgWidth / 2;
            const imgY = (canvasH - imgHeight) / 5;
            const leftEdgeX = imgX - LEFT_PIN_OFFSET;
            const rightEdgeX = imgX + imgWidth + RIGHT_PIN_OFFSET;
            const startY = imgY + TOP_PIN_OFFSET;

            // 准备引脚数据
            const leftPins = pinConfig.left.map((pin, i) => ({
                ...pin,
                y: startY + LEFT_START_Y + i * PIN_ROW_HEIGHT,
                side: 'left',
                startX: centerX,
                targetX: leftEdgeX
            }));
            const rightPins = pinConfig.right.map((pin, i) => ({
                ...pin,
                y: startY + RIGHT_START_Y + i * PIN_ROW_HEIGHT,
                side: 'right',
                startX: centerX,
                targetX: rightEdgeX
            }));

            function easeOutCubic(t) {
                return 1 - Math.pow(1 - t, 3);
            }

            function animate(timestamp) {
                const elapsed = timestamp - startTime;

                // 清空画布
                animCtx.fillStyle = '#fff';
                animCtx.fillRect(0, 0, canvasW, canvasH);

                // 板子旋转动画
                let boardProgress = Math.min(elapsed / boardAnimDuration, 1);
                let boardEase = easeOutCubic(boardProgress);

                // 3D旋转参数
                const rotateX = 15 * (1 - boardEase);
                const rotateY = -10 * (1 - boardEase);
                const rotateZ = 5 * (1 - boardEase);
                const scale = 0.9 + 0.1 * boardEase;
                const opacity = boardEase;

                // 绘制旋转的板子
                animCtx.save();
                animCtx.globalAlpha = opacity;
                animCtx.translate(centerX, canvasH / 2);
                animCtx.scale(scale, scale);
                animCtx.rotate(rotateZ * Math.PI / 180);
                animCtx.transform(1, 0, -Math.tan(rotateY * Math.PI / 180), 1, 0, 0);
                animCtx.transform(1, -Math.tan(rotateX * Math.PI / 180), 0, 1, 0, 0);
                animCtx.translate(-centerX, -canvasH / 2);
                animCtx.drawImage(boardImage, imgX, imgY, imgWidth, imgHeight);
                animCtx.restore();

                // 引脚推出动画（从中间往两侧）
                if (elapsed > pinAnimDelay) {
                    const pinElapsed = elapsed - pinAnimDelay;
                    const pinProgress = Math.min(pinElapsed / pinAnimDuration, 1);
                    const pinEase = easeOutCubic(pinProgress);

                    const allPins = [...leftPins, ...rightPins];
                    allPins.forEach(pin => {
                        const currentX = pin.startX + (pin.targetX - pin.startX) * pinEase;
                        const opacity = pinEase;

                        // 绘制圆点
                        animCtx.globalAlpha = opacity;
                        animCtx.fillStyle = 'rgba(102, 126, 234, 1)';
                        animCtx.beginPath();
                        animCtx.arc(currentX, pin.y, PIN_RADIUS, 0, Math.PI * 2);
                        animCtx.fill();

                        // 绘制文字
                        const textX = pin.side === 'left' ? currentX - 20 : currentX + 20;
                        animCtx.fillStyle = '#333';
                        animCtx.font = 'bold 14px "Segoe UI", Arial, sans-serif';
                        animCtx.textAlign = pin.side === 'left' ? 'right' : 'left';
                        animCtx.fillText(formatGpioText(pin.name), textX, pin.y + 5);
                    });

                    animCtx.globalAlpha = 1;
                }

                if (elapsed < boardAnimDuration + pinAnimDelay + pinAnimDuration) {
                    requestAnimationFrame(animate);
                } else {
                    onComplete();
                }
            }

            requestAnimationFrame(animate);
        }

        function collectFeatureStats() {
            featureStats = {};
            const allPins = [
                ...pinConfig.left.map((pin, index) => ({ ...pin, edge: 'left', index })),
                ...pinConfig.right.map((pin, index) => ({ ...pin, edge: 'right', index }))
            ];

            allPins.forEach(pin => {
                if (pin.features && Array.isArray(pin.features)) {
                    pin.features.forEach(feature => {
                        // 提取功能类型
                        let featureType = feature;
                        if (feature.startsWith('ADC')) {
                            featureType = 'ADC';  // 所有ADC统一为 ADC
                        } else if (feature.startsWith('TOUCH')) {
                            featureType = 'TOUCH';
                        } else if (feature.startsWith('DAC')) {
                            featureType = 'DAC';
                        }
                        
                        if (!featureStats[featureType]) {
                            featureStats[featureType] = 0;
                        }
                        featureStats[featureType]++;
                    });
                }
                
                // 检查function字段中是否包含UART
                if (pin.function && pin.function.includes('UART')) {
                    if (!featureStats['UART']) {
                        featureStats['UART'] = 0;
                    }
                    featureStats['UART']++;
                }
            });

            // 统计I2C引脚
            if (pinConfig.i2c) {
                featureStats['I2C'] = 2; // SDA + SCL
            }
            // 统计SPI引脚
            if (pinConfig.spi) {
                featureStats['SPI'] = 4; // MOSI + MISO + SCK + CS
            }
        }

        function buildFilterPanel() {
            const filterPanel = document.getElementById('filterPanel');
            filterPanel.innerHTML = '<h3>📋 功能筛选</h3><div class="filter-container" id="filterContainer"></div>';

            const filterContainer = document.getElementById('filterContainer');

            // 自定义排序顺序（将I2C和SPI放在前面）
            const featureOrder = ['I2C', 'SPI', 'PWM', 'ADC', 'DAC', 'TOUCH', 'UART'];
            const sortedFeatures = featureOrder.filter(f => featureStats[f] !== undefined);

            sortedFeatures.forEach(feature => {
                const div = document.createElement('div');
                div.className = 'filter-item';

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.id = 'filter-' + feature;

                // 单选逻辑：选中时清除其他，只保留自己
                checkbox.addEventListener('change', (e) => {
                    if (e.target.checked) {
                        // 清除所有其他选中
                        document.querySelectorAll('#filterContainer input[type="checkbox"]').forEach(cb => {
                            if (cb !== checkbox) cb.checked = false;
                        });
                        selectedFeatures.clear();
                        selectedFeatures.add(feature);
                    } else {
                        selectedFeatures.clear();
                    }
                    drawPinmap();
                });

                // 点击整个item区域也可以切换
                div.addEventListener('click', (e) => {
                    // 防止重复触发
                    if (e.target === checkbox) return;

                    checkbox.checked = !checkbox.checked;
                    if (checkbox.checked) {
                        // 清除其他选中
                        document.querySelectorAll('#filterContainer input[type="checkbox"]').forEach(cb => {
                            if (cb !== checkbox) cb.checked = false;
                        });
                        selectedFeatures.clear();
                        selectedFeatures.add(feature);
                    } else {
                        selectedFeatures.clear();
                    }
                    drawPinmap();
                });

                const label = document.createElement('label');
                label.htmlFor = 'filter-' + feature;
                label.textContent = feature;
                label.style.cursor = 'pointer';

                const count = document.createElement('span');
                count.className = 'count';
                count.textContent = ' (' + featureStats[feature] + ')';
                label.appendChild(count);

                div.appendChild(checkbox);
                div.appendChild(label);
                filterContainer.appendChild(div);
            });
        }

        function isPinMatching(pin, isSpecialGroup = false) {
            // 如果没有选中任何功能，所有引脚都匹配（正常显示）
            if (selectedFeatures.size === 0) {
                return true;
            }

            // 检查是否是I2C引脚
            if (selectedFeatures.has('I2C') && pinConfig.i2c) {
                if (pin.pin == pinConfig.i2c.SDA || pin.pin == pinConfig.i2c.SCL) {
                    // 在right/left组中不匹配I2C引脚，让它们只显示在I2C组
                    if (!isSpecialGroup) {
                        return false;
                    }
                    return true;
                }
            }

            // 检查是否是SPI引脚
            if (selectedFeatures.has('SPI') && pinConfig.spi) {
                if (pin.pin == pinConfig.spi.MOSI ||
                    pin.pin == pinConfig.spi.MISO ||
                    pin.pin == pinConfig.spi.SCK ||
                    pin.pin == pinConfig.spi.CS) {
                    // 在right/left组中不匹配SPI引脚，让它们只显示在SPI组
                    if (!isSpecialGroup) {
                        return false;
                    }
                    return true;
                }
            }

            let matches = false;

            // 检查features数组
            if (pin.features && Array.isArray(pin.features)) {
                matches = pin.features.some(feature => {
                    let featureType = feature;
                    if (feature.startsWith('ADC')) {
                        featureType = 'ADC';  // 所有ADC统一为 ADC
                    } else if (feature.startsWith('TOUCH')) {
                        featureType = 'TOUCH';
                    } else if (feature.startsWith('DAC')) {
                        featureType = 'DAC';
                    }
                    return selectedFeatures.has(featureType);
                });
            }

            // 检查function字段中是否包含UART
            if (!matches && selectedFeatures.has('UART') && pin.function && pin.function.includes('UART')) {
                matches = true;
            }

            return matches;
        }

        function drawPinmap() {
            const canvasW = canvas.width;
            const canvasH = canvas.height;
            const centerX = canvasW / 2;

            // 清空画布
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, canvasW, canvasH);

            // 绘制NovaStar图片
            const imgWidth = 573;
            const imgHeight = (imgWidth * boardImage.height) / boardImage.width;
            const x = centerX - imgWidth / 2;
            const y = (canvasH - imgHeight) / 5;

            ctx.drawImage(boardImage, x, y, imgWidth, imgHeight);

            // 存储图片位置用于引脚定位
            drawPinAnnotations(x, y, imgWidth, imgHeight);
        }

        function drawPinAnnotations(imgX, imgY, imgWidth, imgHeight) {
            // 基于图片的尺寸计算引脚位置
            const leftEdgeX = imgX - LEFT_PIN_OFFSET;
            const rightEdgeX = imgX + imgWidth + RIGHT_PIN_OFFSET;
            const startY = imgY + TOP_PIN_OFFSET;

            // 计算筛选面板应该放在的位置
            const filterPanelTop = imgY + imgHeight + FILTER_PANEL_OFFSET;
            const filterPanel = document.getElementById('filterPanel');
            if (filterPanel) {
                filterPanel.style.bottom = 'auto';
                filterPanel.style.top = (filterPanelTop) + 'px';
            }

            // 绘制左侧引脚
            pinConfig.left.forEach((pin, index) => {
                const y = startY + LEFT_START_Y + index * PIN_ROW_HEIGHT;

                const hasSelection = selectedFeatures.size > 0;
                const isMatching = hasSelection && isPinMatching(pin);
                const opacity = !hasSelection ? 1 : (isMatching ? 1 : 0.2);

                // 被选中时圆点变色
                ctx.fillStyle = isMatching ? '#fbbf24' : `rgba(102, 126, 234, ${opacity})`;
                ctx.beginPath();
                ctx.arc(leftEdgeX, y, PIN_RADIUS, 0, Math.PI * 2);
                ctx.fill();

                // 高亮环（只有选中功能后才显示）
                if (isMatching) {
                    ctx.strokeStyle = '#fbbf24';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(leftEdgeX, y, PIN_RADIUS + 6, 0, Math.PI * 2);
                    ctx.stroke();
                }

                ctx.fillStyle = !hasSelection ? '#333' : (isMatching ? '#333' : '#ccc');
                ctx.font = 'bold 14px "Segoe UI", Arial, sans-serif';
                ctx.textAlign = 'right';
                ctx.fillText(formatGpioText(pin.name), leftEdgeX - 20, y + 5);

                pin._x = leftEdgeX;
                pin._y = y;
                pin._edge = 'left';
            });

            // 绘制右侧引脚
            pinConfig.right.forEach((pin, index) => {
                const y = startY + RIGHT_START_Y + index * PIN_ROW_HEIGHT;

                const hasSelection = selectedFeatures.size > 0;
                const isMatching = hasSelection && isPinMatching(pin);
                const opacity = !hasSelection ? 1 : (isMatching ? 1 : 0.2);

                // 被选中时圆点变色
                ctx.fillStyle = isMatching ? '#fbbf24' : `rgba(102, 126, 234, ${opacity})`;
                ctx.beginPath();
                ctx.arc(rightEdgeX, y, PIN_RADIUS, 0, Math.PI * 2);
                ctx.fill();

                // 高亮环（只有选中功能后才显示）
                if (isMatching) {
                    ctx.strokeStyle = '#fbbf24';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(rightEdgeX, y, PIN_RADIUS + 6, 0, Math.PI * 2);
                    ctx.stroke();
                }

                ctx.fillStyle = !hasSelection ? '#333' : (isMatching ? '#333' : '#ccc');
                ctx.font = 'bold 14px "Segoe UI", Arial, sans-serif';
                ctx.textAlign = 'left';
                ctx.fillText(formatGpioText(pin.name), rightEdgeX + 20, y + 5);

                pin._x = rightEdgeX;
                pin._y = y;
                pin._edge = 'right';
            });

            // 绘制I2C引脚（当选中I2C时显示）
            if (selectedFeatures.has('I2C') && pinConfig.i2c) {
                const i2cPins = [
                    { name: 'GPIO' + pinConfig.i2c.SDA, label: 'SDA', pin: pinConfig.i2c.SDA },
                    { name: 'GPIO' + pinConfig.i2c.SCL, label: 'SCL', pin: pinConfig.i2c.SCL }
                ];

                const i2cEdgeX = imgX + I2C_PIN_OFFSET;

                i2cPins.forEach((i2cPin, index) => {
                    const y = startY + I2C_START_Y + index * PIN_ROW_HEIGHT;

                    ctx.fillStyle = 'rgba(76, 175, 80, 1)';
                    ctx.beginPath();
                    ctx.arc(i2cEdgeX, y, PIN_RADIUS, 0, Math.PI * 2);
                    ctx.fill();

                    // 高亮环
                    ctx.strokeStyle = '#4caf50';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(i2cEdgeX, y, PIN_RADIUS + 6, 0, Math.PI * 2);
                    ctx.stroke();

                    // 背景矩形（在圆点右侧）
                    ctx.fillStyle = '#4caf50';
                    ctx.fillRect(i2cEdgeX + 10, y - 10, 90, 20);

                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 14px "Segoe UI", Arial, sans-serif';
                    ctx.textAlign = 'left';
                    ctx.fillText(formatGpioText(i2cPin.name), i2cEdgeX + 18, y + 5);

                    // 保存位置信息到全局变量
                    i2cPinPositions[i2cPin.pin] = { _x: i2cEdgeX, _y: y, _edge: 'i2c' };
                });
            }

            // 绘制SPI引脚（当选中SPI时显示）
            if (selectedFeatures.has('SPI') && pinConfig.spi) {
                const spiPins = [
                    { name: 'GPIO' + pinConfig.spi.MOSI, label: 'MOSI', pin: pinConfig.spi.MOSI },
                    { name: 'GPIO' + pinConfig.spi.MISO, label: 'MISO', pin: pinConfig.spi.MISO },
                    { name: 'GPIO' + pinConfig.spi.SCK, label: 'SCK', pin: pinConfig.spi.SCK },
                    { name: 'GPIO' + pinConfig.spi.CS, label: 'CS', pin: pinConfig.spi.CS }
                ];

                const spiEdgeX = imgX + imgWidth + SPI_PIN_OFFSET;

                spiPins.forEach((spiPin, index) => {
                    const y = startY + SPI_START_Y + index * PIN_ROW_HEIGHT;

                    ctx.fillStyle = 'rgba(255, 152, 0, 1)';
                    ctx.beginPath();
                    ctx.arc(spiEdgeX, y, PIN_RADIUS, 0, Math.PI * 2);
                    ctx.fill();

                    // 高亮环
                    ctx.strokeStyle = '#ff9800';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(spiEdgeX, y, PIN_RADIUS + 6, 0, Math.PI * 2);
                    ctx.stroke();

                    // 背景矩形（在圆点右侧）
                    ctx.fillStyle = '#ff9800';
                    ctx.fillRect(spiEdgeX + 10, y - 10, 90, 20);

                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 14px "Segoe UI", Arial, sans-serif';
                    ctx.textAlign = 'left';
                    ctx.fillText(formatGpioText(spiPin.name), spiEdgeX + 18, y + 5);

                    // 保存位置信息到全局变量
                    spiPinPositions[spiPin.pin] = { _x: spiEdgeX, _y: y, _edge: 'spi' };
                });
            }

            // 更新用于交互的引脚数组
            updateInteractivePins();
        }

        function updateInteractivePins() {
            // 收集所有带位置信息的引脚用于交互
            allInteractivePins = [
                ...pinConfig.left.filter(pin => pin._x !== undefined).map(pin => ({ ...pin })),
                ...pinConfig.right.filter(pin => pin._x !== undefined).map(pin => ({ ...pin }))
            ];

            // 如果选中了I2C，添加I2C引脚
            if (selectedFeatures.has('I2C') && pinConfig.i2c) {
                const i2cPins = [
                    { pin: pinConfig.i2c.SDA, name: 'GPIO' + pinConfig.i2c.SDA, function: 'SDA (串行数据线)', features: ['I2C'] },
                    { pin: pinConfig.i2c.SCL, name: 'GPIO' + pinConfig.i2c.SCL, function: 'SCL (串行时钟线)', features: ['I2C'] }
                ];
                // 使用保存的位置信息
                i2cPins.forEach(i2cPin => {
                    const pos = i2cPinPositions[i2cPin.pin];
                    if (pos) {
                        i2cPin._x = pos._x;
                        i2cPin._y = pos._y;
                        i2cPin._edge = pos._edge;
                    }
                });
                allInteractivePins.push(...i2cPins);
            }

            // 如果选中了SPI，添加SPI引脚
            if (selectedFeatures.has('SPI') && pinConfig.spi) {
                const spiPins = [
                    { pin: pinConfig.spi.MOSI, name: 'GPIO' + pinConfig.spi.MOSI, function: 'MOSI (主发从收数据线)', features: ['SPI'] },
                    { pin: pinConfig.spi.MISO, name: 'GPIO' + pinConfig.spi.MISO, function: 'MISO (主收从发数据线)', features: ['SPI'] },
                    { pin: pinConfig.spi.SCK, name: 'GPIO' + pinConfig.spi.SCK, function: 'SCK (串行时钟线)', features: ['SPI'] },
                    { pin: pinConfig.spi.CS, name: 'GPIO' + pinConfig.spi.CS, function: 'CS (片选信号线)', features: ['SPI'] }
                ];
                // 使用保存的位置信息
                spiPins.forEach(spiPin => {
                    const pos = spiPinPositions[spiPin.pin];
                    if (pos) {
                        spiPin._x = pos._x;
                        spiPin._y = pos._y;
                        spiPin._edge = pos._edge;
                    }
                });
                allInteractivePins.push(...spiPins);
            }
        }

        function setupInteractivity() {
            canvas.addEventListener('mousemove', (e) => {
                const rect = canvas.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;

                let found = false;
                for (let pin of allInteractivePins) {
                    if (pin._x && pin._y) {
                        const dx = mouseX - pin._x;
                        const dy = mouseY - pin._y;
                        const distance = Math.sqrt(dx * dx + dy * dy);

                        // 只有匹配当前选中功能的引脚才显示弹窗
                        // 对于I2C/SPI专用组，需要传入isSpecialGroup=true
                        const isSpecial = pin._edge === 'i2c' || pin._edge === 'spi';
                        if (distance < PIN_RADIUS + 10 && isPinMatching(pin, isSpecial)) {
                            showPinInfo(pin, mouseX, mouseY);
                            canvas.style.cursor = 'pointer';
                            found = true;
                            break;
                        }
                    }
                }

                if (!found) {
                    pinInfo.style.display = 'none';
                    canvas.style.cursor = 'default';
                }
            });

            canvas.addEventListener('mouseleave', () => {
                pinInfo.style.display = 'none';
            });
        }

        function showPinInfo(pin, x, y) {
            const pinInfo = document.getElementById('pinInfo');
            let featureText = pin.features.join(' / ');

            // 如果是I2C或SPI引脚，显示更详细的信息
            let pinFunction = pin.function;
            if (pin._label) {
                pinFunction = `${pin._label} (${pin.function})`;
            }

            pinInfo.innerHTML = `
                <div class="pin-header">GPIO ${pin.pin}</div>
                <div>${pinFunction}</div>
                <div class="pin-features">${featureText}</div>
            `;

            // 位置调整（向右下偏移，避免鼠标遮挡）
            let left = x + 40;
            let top = y + 40;

            if (left + 250 > canvas.width) {
                left = x - 250 - 15;
            }
            if (top + 150 > canvas.height) {
                top = y - 150;
            }

            pinInfo.style.left = left + 'px';
            pinInfo.style.top = top + 'px';
            pinInfo.style.display = 'block';
        }

        function buildInfoPanel() {
            const infoGrid = document.getElementById('infoGrid');
            infoGrid.innerHTML = '';

            // 功能介绍（根据 NovaStar 板子实际引出的引脚统计）
            const infoItems = [
                {
                    title: 'GPIO (通用输入输出)',
                    content: '左侧7个 + 右侧12个 + I2C 2个 + SPI 3个<br>共24个可编程GPIO引脚'
                },
                {
                    title: 'ADC (模拟转数字)',
                    content: 'ADC1: 6通道<br>ADC2: 10通道<br>12位分辨率，0-4095量化范围'
                },
                {
                    title: 'DAC (数字转模拟)',
                    content: '2个独立DAC通道<br>8位分辨率，0-255输出范围'
                },
                {
                    title: 'I2C (集成电路总线)',
                    content: '2个引脚 (SDA, SCL)<br>支持标准/快速模式'
                },
                {
                    title: 'SPI (串行外设接口)',
                    content: '4个引脚 (MOSI, MISO, SCK, CS)<br>4线制全双工通信'
                },
                {
                    title: 'UART (串口)',
                    content: '2个引脚 (TX, RX)<br>UART2 串口通信'
                },
                {
                    title: 'PWM (脉冲宽度调制)',
                    content: '16个独立PWM通道<br>可配置频率和占空比'
                },
                {
                    title: 'TOUCH (触摸传感)',
                    content: '10个触摸通道<br>支持触摸按键和滑条'
                }
            ];

            infoItems.forEach(item => {
                const div = document.createElement('div');
                div.className = 'info-item';
                div.innerHTML = `
                    <strong>${item.title}</strong><br>
                    ${item.content}
                `;
                infoGrid.appendChild(div);
            });

            // 启动滚动观察器
            setupScrollObserver();
        }

        // 滚动观察器：检测info-item进入视口时触发动画
        function setupScrollObserver() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            }, {
                threshold: 0.1,
                rootMargin: '0px 0px -50px 0px'
            });

            document.querySelectorAll('.info-item').forEach(item => {
                observer.observe(item);
            });
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', loadConfig);

        // 响应式调整
        window.addEventListener('resize', () => {
            if (pinConfig) {
                const container = canvas.parentElement;
                canvas.width = Math.min(1200, container.clientWidth - 80);
                drawPinmap();
            }
        });
    </script>
</body>
